<!doctype html>
<html lang="vi">
<head>
<script>window.REDSUN_PREVIEW = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo payment — RedSun Villa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw-config.js"></script>
<link rel="stylesheet" href="css/tokens.css">
</head>
<body class="grid min-h-screen place-items-center bg-paper-2 p-4 font-sans antialiased">

<main class="w-full max-w-sm rounded-3xl border border-clay/70 bg-paper-card p-7 floating">
  <p class="text-xs font-semibold uppercase tracking-[0.14em] text-ink-muted">Demo · Không có tiền thật / No real money</p>
  <h1 id="amount" class="mt-2 font-display text-3xl font-semibold"></h1>
  <p id="info" class="copy mt-1 text-sm text-ink-muted"></p>
  <button id="ok" type="button" class="btn mt-6 min-h-[3rem] w-full rounded-full bg-terra font-semibold text-paper hover:bg-terra-700">Thanh toán thành công · Simulate success</button>
  <button id="fail" type="button" class="btn mt-2 min-h-[3rem] w-full rounded-full border border-clay font-semibold hover:bg-paper-2">Thất bại · Simulate failure</button>
</main>
<script type="module">
  import { completeDemoPayment, findDemoBooking } from './js/preview.js';
  const ref = new URLSearchParams(location.search).get('ref') ?? '';
  const b = findDemoBooking(ref);
  document.getElementById('amount').textContent = b ? new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(b.amountDue) : '—';
  document.getElementById('info').textContent = b ? `${b.ref} · ${b.checkIn} → ${b.checkOut}` : 'Không tìm thấy đặt phòng / Booking not found';
  const go = (ok) => { completeDemoPayment(ref, ok); location.href = `booking.html?ref=${encodeURIComponent(ref)}${ok ? '' : '&failed=1'}`; };
  document.getElementById('ok').addEventListener('click', () => go(true));
  document.getElementById('fail').addEventListener('click', () => go(false));
</script>
</body>
</html>
