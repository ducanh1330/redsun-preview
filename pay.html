<!doctype html>
<html lang="vi">
<head>
<script>window.REDSUN_PREVIEW = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo payment — RedSun Villa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw-config.js"></script>
<link rel="stylesheet" href="css/tokens.css">
</head>
<!-- Pages demo, in-app browsers only: the demo gateway (normally the /pay/demo
     route, answered by the service worker) as a page talking to the in-page server. -->
<body class="grid min-h-screen place-items-center bg-paper-2 p-4 font-sans antialiased">

<main class="w-full max-w-sm rounded-3xl border border-clay/70 bg-paper-card p-7 floating">
  <p class="text-xs font-semibold uppercase tracking-[0.14em] text-ink-muted">Demo · Không có tiền thật / No real money</p>
  <h1 id="amount" class="mt-2 font-display text-3xl font-semibold">…</h1>
  <p id="info" class="copy mt-1 text-sm text-ink-muted"></p>
  <button id="ok" type="button" disabled class="btn mt-6 min-h-[3rem] w-full rounded-full bg-terra font-semibold text-paper hover:bg-terra-700 active:bg-terra-700">Thanh toán thành công · Simulate success</button>
  <button id="fail" type="button" disabled class="btn mt-2 min-h-[3rem] w-full rounded-full border border-clay font-semibold hover:bg-paper-2 active:bg-paper-2">Thất bại · Simulate failure</button>
</main>
<script type="module">
  import { apiFetch } from './js/api.js';
  const txn = new URLSearchParams(location.search).get('txn') ?? '';
  const res = await apiFetch(`pay/demo?txn=${encodeURIComponent(txn)}`);
  if (res.ok) {
    // Same content as the server's gateway page: amount in <h1>, booking in the next <p>.
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    document.getElementById('amount').textContent = doc.querySelector('h1')?.textContent ?? '';
    document.getElementById('info').textContent = doc.querySelector('h1 + p')?.textContent.split('.')[0] ?? '';
    for (const id of ['ok', 'fail']) document.getElementById(id).disabled = false;
  } else {
    document.getElementById('amount').textContent = '—';
    document.getElementById('info').textContent = 'Không tìm thấy thanh toán / Payment not found';
  }
  const go = async (result) => {
    const r = await apiFetch('pay/demo', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ txn, result }) });
    location.href = r.headers.get('location') ?? 'index.html';
  };
  document.getElementById('ok').addEventListener('click', () => go('success'));
  document.getElementById('fail').addEventListener('click', () => go('fail'));
</script>
</body>
</html>
